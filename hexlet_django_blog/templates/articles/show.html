{% extends "base.html" %}

{% block content %}
     <h1>{{ article.title }}</h1>
    <div>{{ article.content }}</div>

    <!-- Форма удаления -->
    <form action="{% url 'articles_delete' article.id %}" method="post" style="margin-top:20px;">
        {% csrf_token %}
        <input type="submit" value="Удалить">
    </form>
{% endblock %}
